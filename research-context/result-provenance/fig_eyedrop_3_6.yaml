caption_draft: "Comparison of the simple bright-field image from the ThorCam (left), a globally rectified light-field reconstruction (center), and combined global-plus-local rectification (right). The ThorCam image is acquired with a compound bright-field/fluorescence microscope that uses the same objective for illumination and collection: the objective and a simple lens form one 4F system, followed by a second 4F relay for additional magnification. In the light-field path, a microlens array replaces the simple lens immediately before the ThorCam; a further 4F relay after the array fits the light-field image to the main-camera sensor. The Global and Local panels are generated by image processing from the light-field data; Local applies pixelwise refinement after global rectification."

