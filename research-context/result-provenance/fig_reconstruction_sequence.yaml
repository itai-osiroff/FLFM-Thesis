notes:
  question: How do the image stack, matching references, and estimated displacements connect the two reconstruction stages?
  design: >-
    Two shaded stage groups, a continuous intensity path, a parallel matching
    path, labeled displacement arrows, and schematic uniform-versus-varying
    displacement sketches. Editable TikZ preserves thesis typography and vector sharpness.
  interpretation: >-
    Global alignment retains the view stack and forms an intermediate mean.
    That mean supplies the selected local reference. Local backward remapping
    acts on the unthresholded globally aligned views before their final mean.
  known_limitations: >-
    Describes the central-global-reference and global-average-local-reference
    path already presented in Chapter 5. Does not establish historical run
    settings, measured displacement fields, improvement, volumetric recovery,
    or a scattering inverse. Extraction, HDR timing, optional references,
    field smoothing, and evaluation are outside this schematic's scope.
  verification: >-
    Source operations inspected at the implementation commit above; full thesis
    compiled with latexmk/XeLaTeX and Figure 5.1 visually checked after rendering.
